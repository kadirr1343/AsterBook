name: correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-13 cmake ninja-build python3 clang-format-18
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Format
        run: find include src apps tests benchmarks -name '*.cpp' -o -name '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: CLI and benchmark smoke
        run: |
          build/${{ matrix.preset }}/asterbook verify --input examples/sweep.csv
          build/${{ matrix.preset }}/asterbook generate --seed 42 --count 100 --scenario mixed --output out/smoke.csv
          build/${{ matrix.preset }}/asterbook bench --input out/smoke.csv --engine both --output out/bench.csv
          python3 tools/report.py --bench out/bench.csv --output out/report.html
  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y g++-13 cmake ninja-build python3
      - run: cmake --preset sanitize -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build --preset sanitize
      - run: ctest --preset sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
